<textarea id="w" rows="8" cols="60"></textarea><br>
<button onclick="go()">Diagnose</button>
<pre id="p"></pre>
<script>
const KEY = "gsk_PASTE_YOUR_KEY_HERE";
async function go(){
  const r = await fetch("https://api.groq.com/openai/v1/chat/completions", {method:"POST",
    headers:{"Content-Type":"application/json", "Authorization":"Bearer " + KEY},
    body: JSON.stringify({model:"llama-3.3-70b-versatile",
      messages:[{role:"user", content:"Diagnose this creator workflow and give a short numbered plan:\n\n" + w.value}]})});
  p.textContent = (await r.json()).choices[0].message.content;
}
</script>
